services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
      MARIADB_DATABASE: wordpress
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    ports:
      - '127.0.0.1:8080:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ''
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/atelier-builder:ro
volumes:
  db:
  wp:
